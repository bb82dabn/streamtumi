name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      APP_URL: http://localhost:3000
      APP_SECRET: ci-only-secret-with-at-least-48-random-characters
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: localhost
      S3_ACCESS_KEY: ci
      S3_SECRET_KEY: ci-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix packages/contracts
      - run: npm ci --prefix apps/mobile
      - run: npm audit --audit-level=high
      - run: npm run brand:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run roku:check
      - run: npm run build
      - run: docker build -t streamtumi:${{ github.sha }} .

  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-bookworm@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
        env:
          POSTGRES_USER: streamtumi
          POSTGRES_PASSWORD: streamtumi
          POSTGRES_DB: streamtumi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U streamtumi -d streamtumi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGPASSWORD: streamtumi
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: psql -h 127.0.0.1 -U streamtumi -d streamtumi -c "CREATE TABLE schema_migrations (name text PRIMARY KEY, checksum text NOT NULL, applied_at timestamptz NOT NULL DEFAULT now())"
      - run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U streamtumi -d streamtumi -f sql/001_initial.sql
      - run: test "$(psql -At -h 127.0.0.1 -U streamtumi -d streamtumi -c "SELECT count(*) FROM station_genres")" = "20"

  compose:
    runs-on: ubuntu-latest
    env:
      APP_URL: http://localhost:3000
      APP_DOMAIN: localhost
      APP_SECRET: ci-only-secret-with-at-least-48-random-characters
      ALLOW_INSECURE_HTTP: "true"
      POSTGRES_PASSWORD: ci-postgres-password
      MINIO_ROOT_PASSWORD: ci-minio-password
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker compose config --quiet
      - run: docker compose --profile media --profile radio --profile tv --profile weather --profile proxy config --quiet
      - run: docker compose -f compose.yaml -f compose.gpu.yaml config --quiet

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --prefix ../../packages/contracts
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/contracts/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm test

  weatherstar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: third_party/ws4kp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: third_party/ws4kp/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build
